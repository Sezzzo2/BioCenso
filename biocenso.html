  /* ================= Router ================= */
  const PRIVADAS = new Set(["censo", "fincas", "finca", "bovino", "usuario"]);
  let rutaActual = "";

  function render(opciones = {}) {
    const hash = location.hash.slice(1) || "inicio";
    const [r, a, b, c] = hash.split("/");
    if (PRIVADAS.has(r) && !usuario()) {
      V.retorno = hash; location.replace("#login"); toast("Inicia sesión para continuar"); return;
    }
    if ((r === "login" || r === "registro") && usuario()) { location.replace("#inicio"); return; }
    cancelarProceso();
    let html, seccion = r;
    switch (r) {
      case "login": html = V.login(); break;
      case "registro": html = V.registro(); break;
      case "censo": html = a && a !== "historial" ? V.censoDetalle(a) : V.censo(); break;
      case "fincas": html = a === "nueva" ? V.fincaNueva() : V.fincas(); break;
      case "finca": seccion = "fincas"; html = b === "panel" ? V.panelFinca(a) : b === "bovino" && c === "nuevo" ? V.bovinoForm(a, null) : V.finca(a); break;
      case "bovino": seccion = "fincas"; html = b === "editar" ? V.bovinoForm(null, a) : V.bovino(a); break;
      case "usuario": html = V.usuario(); break;
      default: seccion = "inicio"; html = V.inicio();
    }
    const vista = $("#vista");
    vista.innerHTML = `<section class="vista activa${opciones.quieto ? "" : ""}">${html}</section>`;
    if (opciones.quieto) vista.firstElementChild.style.animation = "none";
    pintarNav(seccion);
    const titulos = { inicio: "Inicio", login: "Iniciar sesión", registro: "Crear cuenta", censo: "Censo", fincas: "Fincas", usuario: "Usuario" };
    document.title = `${titulos[seccion] || "Inicio"} · Biocenso`;
    despues(r, a);
    const nuevaRuta = hash;
    if (!opciones.quieto) {
      const ancla = (r === "inicio" && a) || (r === "censo" && a === "historial" && "historial");
      if (ancla) requestAnimationFrame(() => document.getElementById(ancla)?.scrollIntoView({ behavior: "smooth" }));
      else if (nuevaRuta !== rutaActual) window.scrollTo({ top: 0 });
    }
    rutaActual = nuevaRuta;
  }

  function pintarNav(seccion) {
    const u = usuario();
    $("#nav-usuario").innerHTML = u
      ? `<a href="#usuario" data-ruta="usuario"><span class="avatar" aria-hidden="true">${esc(iniciales(u))}</span>Usuario</a><button class="nav-salir" type="button" data-accion="salir">${ico("salir")}Cerrar sesión</button>`
      : `<a href="#login" data-ruta="login"><span class="avatar" aria-hidden="true">${ico("usuario").replace("<svg>", `<svg style="width:18px;height:18px">`)}</span>Iniciar sesión</a>`;
    $$("[data-ruta]").forEach((el) => {
      const activo = el.dataset.ruta === seccion || (seccion === "registro" && el.dataset.ruta === "login");
      activo ? el.setAttribute("aria-current", "page") : el.removeAttribute("aria-current");
    });
  }

  function despues(r, a) {
    if (r === "inicio" || !r || !["login", "registro", "censo", "fincas", "finca", "bovino", "usuario"].includes(r)) animarDeteccion();
    if (r === "censo" && (!a || a === "historial")) prepararCenso();
    const g = $("#grafico"); if (g) dibujarGrafico(g);
  }

  /* ---------- Animación de detección ---------- */
  function animarDeteccion() {
    const svg = $("#cajas"); if (!svg) return;
    // Posiciones de los bovinos reales en la toma aérea de ejemplo
    const cajas = [[212, 97], [211, 114], [139, 121], [157, 129], [220, 134], [117, 139], [155, 146], [226, 152], [216, 166], [189, 181], [232, 202], [284, 196]];
    svg.innerHTML = cajas.map(([x, y], i) => `<rect class="caja" x="${x - 9}" y="${y - 7}" width="18" height="14" rx="3" style="animation-delay:${(0.5 + i * 0.17).toFixed(2)}s"/>`).join("");
    const el = $("#contador-num");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = cajas.length; return; }
    cajas.forEach((_, i) => setTimeout(() => { if (el.isConnected) el.textContent = i + 1; }, 750 + i * 170));
  }

  /* ---------- Subida y conteo ---------- */
  let archivo = null, proceso = null;

  function prepararCenso() {
    archivo = null;
    const zona = $("#zona");
    zona.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#c-video").click(); } });
    ["dragenter", "dragover"].forEach((t) => zona.addEventListener(t, (e) => { e.preventDefault(); zona.classList.add("sobre"); }));
    ["dragleave", "drop"].forEach((t) => zona.addEventListener(t, (e) => { e.preventDefault(); zona.classList.remove("sobre"); }));
    zona.addEventListener("drop", (e) => elegirVideo(e.dataTransfer.files[0]));
    $("#c-video").addEventListener("change", (e) => elegirVideo(e.target.files[0]));
    V.censo.fincaInicial = null;
  }

  const aviso = (id, msg) => { const a = $(`#${id}`); if (!a) return; a.textContent = msg || ""; a.classList.toggle("ver", !!msg); };

  function elegirVideo(f) {
    aviso("aviso", "");
    if (!f) return;
    const esVideo = /\.(mp4|mov)$/i.test(f.name) || ["video/mp4", "video/quicktime"].includes(f.type);
    const esImagen = f.type.startsWith("image/");
    if (!esVideo && !esImagen) { aviso("aviso", "Ese archivo no es un video MP4 o MOV. Elige el archivo tal como sale del dron."); return; }
    if (f.size > 200 * 1024 * 1024) { aviso("aviso", "El archivo supera los 200 MB. Recorta el vuelo o expórtalo con menor calidad."); return; }
    archivo = f;
    $("#zona").classList.add("con-archivo");
    $("#zona-titulo").innerHTML = `<span class="archivo">${ico("archivo")}${esc(f.name)}</span>`;
    $("#zona-sub").textContent = `${(f.size / 1048576).toFixed(1)} MB · haz click para cambiarlo`;
  }

  function bloquear(si) {
    ["#c-finca", "#c-fecha", "#c-nota", "#c-video", "#b-contar"].forEach((s) => { const el = $(s); if (el) el.disabled = si; });
    $("#b-cancelar").hidden = !si;
    $("#zona").style.pointerEvents = si ? "none" : "";
  }

  function cancelarProceso() { clearInterval(proceso); clearTimeout(proceso); proceso = null; }

  function iniciarConteo() {
    aviso("aviso", "");
    const fincaId = $("#c-finca")?.value, fecha = $("#c-fecha").value, nota = $("#c-nota").value.trim();
    if (!fincaId) return aviso("aviso", "Elige la finca donde volaste el dron. Si no tienes una, regístrala en Fincas.");
    if (!fecha) return aviso("aviso", "Indica la fecha del vuelo.");
    if (fecha > hoyISO()) return aviso("aviso", "La fecha del vuelo no puede ser futura.");
    if (!archivo) return aviso("aviso", "Falta el video. Arrástralo al recuadro o haz click para elegirlo.");
    $("#resultado").classList.remove("ver");
    bloquear(true);
    const prog = $("#progreso"), barra = $("#barra"), txt = $("#progreso-txt");
    prog.classList.add("ver"); barra.classList.remove("analiza"); barra.firstElementChild.style.transform = "scaleX(0)";
    let p = 0;
    const inicio = performance.now();
    proceso = setInterval(() => {
      p = Math.min(100, p + 4 + Math.random() * 8);
      barra.firstElementChild.style.transform = `scaleX(${p / 100})`;
      txt.textContent = `Subiendo video… ${Math.round(p)}%`;
      if (p < 100) return;
      clearInterval(proceso);
      barra.firstElementChild.style.transform = ""; barra.classList.add("analiza");
      txt.textContent = "Video subido. Detectando bovinos fotograma a fotograma…";
      proceso = setTimeout(() => terminarConteo({ fincaId, fecha, nota, inicio }), 2200);
    }, 120);
  }

  function terminarConteo({ fincaId, fecha, nota, inicio }) {
    const reg = registrados(fincaId);
    const bovinos = Math.max(0, reg + Math.round((Math.random() - 0.35) * 4));
    const pesos = animalesDe(fincaId).map((a) => a.peso).filter(Boolean);
    const base = pesos.length ? Math.round(pesos.reduce((s, x) => s + x, 0) / pesos.length) : 380 + Math.round(Math.random() * 40);
    const c = {
      id: siguienteCenso(),
      fincaId, fechaVuelo: fecha, video: archivo.name, duracion: null, bovinos,
      peso: base, pesoMin: Math.round(base * 0.93), pesoMax: Math.round(base * 1.07),
      conteoManual: null, nota, tiempo: Math.round((performance.now() - inicio) / 100) / 10, modelo: "YOLOv26s", estado: "completado",
    };
    const fin = () => {
      $("#progreso").classList.remove("ver"); bloquear(false);
      db.censos.push(c); guardar();
      V.censo.resaltar = c.id; V.censo.filtro = "";
      render({ quieto: true });
      const r = $("#resultado"); r.innerHTML = htmlResultado(c); r.classList.add("ver");
      r.scrollIntoView({ behavior: "smooth", block: "center" });
      toast("Censo guardado en el historial");
    };
    if (!archivo.type.startsWith("video/")) return fin();
    const v = document.createElement("video"), url = URL.createObjectURL(archivo);
    v.preload = "metadata";
    v.onloadedmetadata = () => { if (isFinite(v.duration)) c.duracion = Math.round(v.duration); URL.revokeObjectURL(url); fin(); };
    v.onerror = () => { URL.revokeObjectURL(url); fin(); };
    v.src = url;
  }

  /* ---------- Fotos ---------- */
  let fotoNueva;
  function leerFoto(f) {
    return new Promise((ok, mal) => {
      const r = new FileReader();
      r.onerror = mal;
      r.onload = () => {
        const img = new Image();
        img.onerror = mal;
        img.onload = () => {
          const lado = 480, k = Math.min(1, lado / Math.max(img.width, img.height));
          const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          ok(cv.toDataURL("image/jpeg", 0.8));
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
  }

  /* ================= Formularios ================= */
  const val = (id) => ($(`#${id}`)?.value ?? "").trim();
  function marcar(ids, mal) { ids.forEach((id) => $(`#${id}`)?.setAttribute("aria-invalid", mal.includes(id) ? "true" : "false")); if (mal[0]) $(`#${mal[0]}`)?.focus(); }

  const FORMS = {
    "form-censo": (e) => iniciarConteo(e),

    "f-login": async () => {
      const correo = val("l-correo").toLowerCase(), clave = $("#l-clave").value;
      if (!correo || !clave) { marcar(["l-correo", "l-clave"], [!correo && "l-correo", !clave && "l-clave"].filter(Boolean)); return aviso("aviso-login", "Ingresa tu correo y tu contraseña."); }
      if (!REGLA_CORREO.test(correo)) { marcar(["l-correo"], ["l-correo"]); return aviso("aviso-login", "Ingresa un correo electrónico válido."); }
      const u = db.usuarios.find((x) => x.correo.toLowerCase() === correo);
      if (!u || !u.clave || u.clave !== await hash(clave)) return aviso("aviso-login", "Correo o contraseña incorrectos. Revisa los datos e inténtalo de nuevo.");
      entrar(u);
    },

    "f-registro": async () => {
      const ids = ["r-nombre", "r-apellido", "r-correo", "r-clave", "r-confirmar"];
      const d = { nombre: val("r-nombre"), apellido: val("r-apellido"), correo: val("r-correo").toLowerCase(), clave: $("#r-clave").value, confirmar: $("#r-confirmar").value };
      const mal = ids.filter((id) => !$(`#${id}`).value.trim());
      if (mal.length) { marcar(ids, mal); return aviso("aviso-registro", "Completa todos los campos para continuar."); }
      if (!REGLA_CORREO.test(d.correo)) { marcar(ids, ["r-correo"]); return aviso("aviso-registro", "Ingresa un correo electrónico válido."); }
      if (db.usuarios.some((u) => u.correo.toLowerCase() === d.correo)) { marcar(ids, ["r-correo"]); return aviso("aviso-registro", "Ya existe una cuenta con ese correo. Inicia sesión o usa otro correo."); }
      if (!REGLA_CONTRASENA.test(d.clave)) { marcar(ids, ["r-clave"]); return aviso("aviso-registro", "La contraseña necesita al menos 8 caracteres, una mayúscula, una minúscula y un número."); }
      if (d.clave !== d.confirmar) { marcar(ids, ["r-confirmar"]); return aviso("aviso-registro", "Las contraseñas no coinciden."); }
      const u = { id: nuevoId(), nombre: d.nombre, apellido: d.apellido, correo: d.correo, rol: "Ganadero", clave: await hash(d.clave) };
      db.usuarios.push(u);
      entrar(u, "#fincas", "Tu cuenta fue creada. Ya puedes registrar tus fincas.");
    },

    "f-finca": () => {
      const ids = ["f-nombre", "f-mun", "f-dep"];
      const mal = ids.filter((id) => !val(id));
      if (mal.length) { marcar(ids, mal); return aviso("aviso-finca", "Nombre, municipio y departamento son obligatorios."); }
      if (misFincas().some((f) => normal(f.nombre) === normal(val("f-nombre")))) { marcar(ids, ["f-nombre"]); return aviso("aviso-finca", "Ya tienes una finca con ese nombre."); }
      const f = { id: nuevoId(), usuarioId: db.sesion, nombre: val("f-nombre"), municipio: val("f-mun"), departamento: val("f-dep"), direccion: val("f-dir") };
      db.fincas.push(f); guardar();
      location.hash = `#finca/${f.id}`; toast("La finca se registró correctamente");
    },

    "f-bovino": async (e) => {
      const form = e.target, fid = form.dataset.finca, aid = form.dataset.animal;
      const ids = ["b-numero", "b-sexo", "b-peso"];
      const numero = val("b-numero"), sexo = val("b-sexo"), pesoTxt = val("b-peso");
      const mal = [!numero && "b-numero", !sexo && "b-sexo"].filter(Boolean);
      if (mal.length) { marcar(ids, mal); return aviso("aviso-bovino", mal.length === 2 ? "Escribe el número del animal y selecciona el sexo." : mal[0] === "b-numero" ? "El número del animal es obligatorio." : "Selecciona el sexo."); }
      if (pesoTxt && !(Number(pesoTxt) > 0)) { marcar(ids, ["b-peso"]); return aviso("aviso-bovino", "El peso debe ser mayor que 0."); }
      if (animalesDe(fid).some((a) => a.id !== aid && normal(a.numero) === normal(numero))) { marcar(ids, ["b-numero"]); return aviso("aviso-bovino", `Ya existe un bovino con el número ${numero} en esta finca.`); }
      const datos = { numero, sexo, nacimiento: val("b-nac"), peso: pesoTxt ? Number(pesoTxt) : null, estadoReproductivo: val("b-repro"), estadoGeneral: val("b-general"), enfermedad: val("b-enf") };
      if (fotoNueva !== undefined) datos.foto = fotoNueva;
      let id = aid;
      if (aid) Object.assign(db.animales.find((a) => a.id === aid), datos);
      else { id = nuevoId(); db.animales.push({ id, fincaId: fid, foto: null, ...datos }); }
      fotoNueva = undefined; guardar();
      location.hash = `#bovino/${id}`; toast(aid ? "Cambios guardados" : `Bovino ${numero} registrado`);
    },

    "f-vacuna": () => {
      const id = location.hash.split("/")[1];
      const v = val("v-vacuna"), fecha = val("v-fecha");
      if (!v) { marcar(["v-vacuna", "v-fecha"], ["v-vacuna"]); return aviso("aviso-vacuna", "Selecciona una vacuna."); }
      if (!fecha) { marcar(["v-vacuna", "v-fecha"], ["v-fecha"]); return aviso("aviso-vacuna", "Indica la fecha de aplicación."); }
      if (fecha > hoyISO()) { marcar(["v-vacuna", "v-fecha"], ["v-fecha"]); return aviso("aviso-vacuna", "La fecha no puede ser futura."); }
      if (db.aplicaciones.some((p) => p.animalId === id && p.vacunaId === v && p.fecha === fecha)) return aviso("aviso-vacuna", "Esa aplicación ya está registrada con la misma fecha.");
      db.aplicaciones.push({ id: nuevoId(), animalId: id, vacunaId: v, fecha }); guardar();
      render({ quieto: true }); toast("Vacuna registrada");
    },

    "f-nueva-vacuna": () => {
      const nombre = val("nv-nombre");
      if (nombre.length < 2) { marcar(["nv-nombre"], ["nv-nombre"]); return aviso("aviso-nv", "Escribe el nombre de la vacuna."); }
      if (db.vacunas.some((v) => normal(v.nombre) === normal(nombre))) return aviso("aviso-nv", "Esa vacuna ya está en el catálogo.");
      const v = { id: nuevoId(), nombre }; db.vacunas.push(v); guardar();
      render({ quieto: true }); $("#v-vacuna").value = v.id; toast("Vacuna agregada al catálogo");
    },

    "f-manual": () => {
      const id = location.hash.split("/")[1], texto = val("m-valor");
      if (texto === "") { marcar(["m-valor"], ["m-valor"]); return aviso("aviso-manual", "Ingresa el número de animales contados."); }
      const n = Number(texto);
      if (!Number.isInteger(n) || n < 0) { marcar(["m-valor"], ["m-valor"]); return aviso("aviso-manual", "Debe ser un número entero, 0 o mayor."); }
      db.censos.find((c) => c.id === id).conteoManual = n; guardar();
      render({ quieto: true }); toast("Conteo manual guardado");
    },

    "f-perfil": () => {
      const ids = ["p-nombre", "p-apellido", "p-correo"];
      const mal = ids.filter((id) => !val(id));
      if (mal.length) { marcar(ids, mal); return aviso("aviso-perfil", "Nombre, apellido y correo son obligatorios."); }
      const correo = val("p-correo").toLowerCase();
      if (!REGLA_CORREO.test(correo)) { marcar(ids, ["p-correo"]); return aviso("aviso-perfil", "Ingresa un correo electrónico válido."); }
      if (db.usuarios.some((u) => u.id !== db.sesion && u.correo.toLowerCase() === correo)) { marcar(ids, ["p-correo"]); return aviso("aviso-perfil", "Ese correo ya pertenece a otra cuenta."); }
      Object.assign(usuario(), { nombre: val("p-nombre"), apellido: val("p-apellido"), correo }); guardar();
      V.usuario.editando = false; render({ quieto: true }); toast("Los datos del perfil se actualizaron");
    },
  };

  function entrar(u, destino, msg) {
    db.sesion = u.id; guardar();
    const ir = destino || (V.retorno && !/^(login|registro)/.test(V.retorno) ? `#${V.retorno}` : "#inicio");
    V.retorno = null;
    location.hash = ir; toast(msg || `Hola, ${u.nombre}`);
  }

  /* ================= Eventos ================= */
  document.addEventListener("submit", (e) => {
    const f = FORMS[e.target.id]; if (!f) return;
    e.preventDefault(); f(e);
  });

  document.addEventListener("click", (e) => {
    const cz = e.target.closest("[data-censar]");
    if (cz) V.censo.fincaInicial = cz.dataset.censar;
    const el = e.target.closest("[data-accion]"); if (!el) return;
    const acc = el.dataset.accion;
    if (acc === "salir") { db.sesion = null; guardar(); if (location.hash === "#inicio") render(); else location.hash = "#inicio"; toast("Cerraste sesión"); }
    if (acc === "ejemplo") {
      if (misFincas().length) return toast("Ya tienes fincas registradas");
      cargarEjemplo(db.sesion); guardar();
      if (location.hash === "#fincas") render({ quieto: true }); else location.hash = "#fincas";
      toast("Datos de ejemplo cargados en tu cuenta");
    }
    if (acc === "cerrar-resultado") $("#resultado").classList.remove("ver");
    if (acc === "limpiar-fincas") { V.fincas.q = ""; V.fincas.dep = ""; render({ quieto: true }); }
    if (acc === "limpiar-animales") { V.finca.filtros[el.dataset.finca] = { q: "", sexo: "", estado: "" }; render({ quieto: true }); }
    if (acc === "editar-perfil") { V.usuario.editando = true; render({ quieto: true }); $("#p-nombre").focus(); }
    if (acc === "cancelar-perfil") { V.usuario.editando = false; render({ quieto: true }); }
    if (acc === "pedir-eliminar") {
      $("#acciones-bovino").innerHTML = `<span class="confirmar">¿Eliminar este bovino y sus vacunas? <button class="btn btn-peligro btn-sm" data-accion="eliminar-bovino">Sí, eliminar</button><button class="btn btn-oscuro btn-sm" data-accion="no-eliminar">No</button></span>`;
      $("[data-accion=no-eliminar]").focus();
    }
    if (acc === "no-eliminar") render({ quieto: true });
    if (acc === "eliminar-bovino") {
      const id = location.hash.split("/")[1], a = animal(id);
      db.animales = db.animales.filter((x) => x.id !== id);
      db.aplicaciones = db.aplicaciones.filter((p) => p.animalId !== id); guardar();
      location.hash = `#finca/${a.fincaId}`; toast(`Bovino ${a.numero} eliminado`);
    }
    if (acc === "eliminar-aplicacion") { db.aplicaciones = db.aplicaciones.filter((p) => p.id !== el.dataset.id); guardar(); render({ quieto: true }); toast("Registro eliminado"); }
    if (acc === "mostrar-nueva-vacuna") {
      $("#nueva-vacuna").innerHTML = `<form class="form" id="f-nueva-vacuna" novalidate style="max-width:none"><div class="form-linea linea-nv"><div class="campo"><label for="nv-nombre">Nombre de la nueva vacuna</label><input id="nv-nombre" class="ctl" maxlength="60" placeholder="Ej.: Leptospirosis"></div><button class="btn btn-claro" type="submit">Agregar al catálogo</button><button class="btn btn-oscuro" type="button" data-accion="no-nueva-vacuna">Cancelar</button></div><div class="aviso" id="aviso-nv" role="alert"></div></form>`;
      $("#nv-nombre").focus();
    }
    if (acc === "no-nueva-vacuna") $("#nueva-vacuna").innerHTML = `<button class="btn-texto" type="button" data-accion="mostrar-nueva-vacuna">¿No está en la lista? Agregar vacuna al catálogo</button>`;
  });

  document.addEventListener("click", (e) => { if (e.target.id === "b-cancelar") { cancelarProceso(); $("#progreso").classList.remove("ver"); bloquear(false); aviso("aviso", "Cancelaste la subida. El video sigue seleccionado por si quieres intentarlo de nuevo."); } });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.getAttribute("aria-invalid") === "true") t.setAttribute("aria-invalid", "false");
    if (t.id === "q-finca") { V.fincas.q = t.value; refrescarConFoco(t); }
    if (t.id === "q-animal") { filtroFinca().q = t.value; actualizarAnimales(); }
    if (t.id === "q-vacuna") { V.bovino.q = t.value; refrescarConFoco(t); }
  });

  document.addEventListener("change", async (e) => {
    const t = e.target;
    if (t.id === "h-finca") { V.censo.filtro = t.value; V.censo.resaltar = null; render({ quieto: true }); $("#h-finca").focus(); }
    if (t.id === "dep-finca") { V.fincas.dep = t.value; render({ quieto: true }); $("#dep-finca").focus(); }
    if (t.id === "fs-sexo") { filtroFinca().sexo = t.value; actualizarAnimales(); }
    if (t.id === "fs-estado") { filtroFinca().estado = t.value; actualizarAnimales(); }
    if (t.id === "b-foto") {
      const f = t.files[0]; aviso("aviso-bovino", "");
      if (!f) return;
      if (!f.type.startsWith("image/")) { t.value = ""; return aviso("aviso-bovino", "El archivo debe ser una imagen (PNG, JPG, WEBP…)."); }
      if (f.size > 5 * 1024 * 1024) { t.value = ""; return aviso("aviso-bovino", "La imagen supera los 5 MB."); }
      try { fotoNueva = await leerFoto(f); const p = $("#b-foto-prev"); p.src = fotoNueva; p.hidden = false; }
      catch { aviso("aviso-bovino", "No se pudo leer la imagen. Prueba con otra foto."); }
    }
  });

  const filtroFinca = () => V.finca.filtros[location.hash.split("/")[1]];
  function actualizarAnimales() {
    const id = location.hash.split("/")[1], st = filtroFinca(), q = normal(st.q);
    const lista = animalesDe(id).filter((a) => (!q || normal(`${a.numero} ${a.sexo} ${a.estadoGeneral} ${a.estadoReproductivo} ${a.enfermedad}`).includes(q)) && (!st.sexo || a.sexo === st.sexo) && (!st.estado || a.estadoGeneral === st.estado));
    $("#tabla-animales").innerHTML = tablaAnimales(lista, id);
  }
  function refrescarConFoco(t) {
    const id = t.id, pos = t.selectionStart;
    render({ quieto: true });
    const n = $(`#${id}`); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }

  window.addEventListener("hashchange", () => { fotoNueva = undefined; V.usuario.editando = false; V.bovino.q = ""; render(); });
  render();
})();
</script>
</body>
</html>
